name: nexus-lake-v4

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-lake-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexus_net
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-lake-api
    environment:
      NEXUS_DB_PATH: /tmp/nexus_lakehouse.sqlite3
      NEXUS_CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://127.0.0.1:4173
      POSTGRES_DSN: postgresql://nexus:nexus_dev_pw@postgres:5432/nexus_catalog
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: nexus-medallion-lake
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexus-lake-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_pw
      POSTGRES_DB: nexus_catalog
    ports:
      - "5432:5432"
    volumes:
      - pg_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: nexus-lake-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexusadmin
      MINIO_ROOT_PASSWORD: nexusadmin_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_lake_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net
    restart: unless-stopped

volumes:
  pg_catalog_data:
  minio_lake_data:

networks:
  nexus_net:
    driver: bridge
